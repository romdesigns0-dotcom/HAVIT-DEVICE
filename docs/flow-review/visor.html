<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAVIT · Visor de pantallas Figma/LVGL</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.45 system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17191e; color: #eef1f5; }
    main { width: min(94vw, 760px); padding: 24px 0; text-align: center; }
    h1 { margin: 0 0 6px; font-size: clamp(20px, 4vw, 28px); }
    p { margin: 0 0 16px; color: #bac3cf; }
    #frame { display: block; width: min(88vw, 520px); height: auto; aspect-ratio: 1; object-fit: contain; margin: 16px auto; background: #000; image-rendering: auto; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
    button, select { min-height: 42px; border: 1px solid #566171; border-radius: 9px; padding: 8px 14px; color: inherit; background: #252a33; font: inherit; }
    button { cursor: pointer; }
    button:hover { background: #343b47; }
    #counter { min-width: 76px; color: #c6d1df; }
    #name { margin: 12px 0 0; color: #8fd1f0; font-weight: 600; }
    .note { margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Visor de pantallas HAVIT</h1>
    <p>Frames exportados de LVGL · 360 × 360 · usa ← y → para recorrerlos</p>
    <img id="frame" alt="Frame de pantalla HAVIT">
    <div class="controls">
      <button id="prev" type="button">← Anterior</button>
      <span id="counter" aria-live="polite"></span>
      <button id="next" type="button">Siguiente →</button>
      <select id="screens" aria-label="Elegir pantalla"></select>
    </div>
    <div id="name"></div>
    <p class="note">Muestra capturas reales de los frames exportados; no simula toques ni datos del dispositivo.</p>
  </main>
  <script>
    (async () => {
      const excluded = new Set(['frame_1', 'frame_2', 'frame_3']);
      const response = await fetch('./index.html');
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const screens = Array.from(doc.querySelectorAll('article.card')).map(card => ({
        name: card.querySelector('h3')?.textContent.trim(),
        image: card.querySelector('img')?.getAttribute('src')
      })).filter(screen => screen.name && screen.image && !excluded.has(screen.name));
      const image = document.querySelector('#frame');
      const name = document.querySelector('#name');
      const counter = document.querySelector('#counter');
      const select = document.querySelector('#screens');
      let index = 0;
      screens.forEach((screen, i) => {
        const option = document.createElement('option');
        option.value = String(i);
        option.textContent = screen.name;
        select.append(option);
      });
      const show = () => {
        const screen = screens[index];
        image.src = screen.image;
        image.alt = `Frame ${screen.name} exportado desde LVGL`;
        name.textContent = screen.name;
        counter.textContent = `${index + 1} / ${screens.length}`;
        select.value = String(index);
      };
      const move = delta => { index = (index + delta + screens.length) % screens.length; show(); };
      document.querySelector('#prev').addEventListener('click', () => move(-1));
      document.querySelector('#next').addEventListener('click', () => move(1));
      select.addEventListener('change', () => { index = Number(select.value); show(); });
      window.addEventListener('keydown', event => {
        if(event.key === 'ArrowRight' || event.key === 'PageDown') { event.preventDefault(); move(1); }
        if(event.key === 'ArrowLeft' || event.key === 'PageUp') { event.preventDefault(); move(-1); }
      });
      if(screens.length) show();
      else document.querySelector('main').insertAdjacentText('beforeend', ' No se encontraron frames.');
    })().catch(error => {
      document.querySelector('main').insertAdjacentText('beforeend', ` No se pudo cargar el inventario: ${error.message}`);
    });
  </script>
</body>
</html>
